<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSTA L&D Metrics Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#6366f1;--green:#22c55e;--red:#ef4444;--yellow:#eab308}
[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#6366f1}
[data-theme="white"]{--bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--accent:#6366f1}
[data-theme="purple"]{--bg:#f5f0ff;--card:#ede5ff;--border:#d8b4fe;--text:#2e1065;--muted:#6b21a8;--accent:#9333ea}
[data-theme="pink"]{--bg:#fdf2f8;--card:#fce7f3;--border:#f9a8d4;--text:#500724;--muted:#9d174d;--accent:#ec4899}
[data-theme="blue"]{--bg:#0a1628;--card:#0f2440;--border:#1e3a5f;--text:#e0f2fe;--muted:#7dd3fc;--accent:#38bdf8}
[data-theme="green"]{--bg:#0a1a0f;--card:#0f2918;--border:#1a4028;--text:#dcfce7;--muted:#86efac;--accent:#4ade80}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:20px;transition:background .3s,color .3s}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.4rem;font-weight:700}
.header h1 span{color:var(--accent)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls select,.controls button{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:.72rem;cursor:pointer}
.controls button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.controls .download-btn{background:var(--accent);color:#fff;font-weight:600}
.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{padding:10px 20px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--muted);cursor:pointer;font-size:.78rem;font-weight:600;transition:all .2s}
.tab-btn:hover{border-color:var(--accent);color:var(--text)}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}
.period-label{font-size:.78rem;color:var(--accent);font-weight:600;margin-bottom:14px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;border-left:4px solid var(--border);transition:border-color .3s,box-shadow .3s}
.kpi-card.status-green{border-left-color:var(--green);box-shadow:inset 0 0 20px rgba(34,197,94,.05)}
.kpi-card.status-yellow{border-left-color:var(--yellow);box-shadow:inset 0 0 20px rgba(234,179,8,.05)}
.kpi-card.status-red{border-left-color:var(--red);box-shadow:inset 0 0 20px rgba(239,68,68,.05)}
.kpi-card.status-neutral{border-left-color:var(--muted)}
.kpi-card .label{font-size:.62rem;color:var(--muted);text-transform:uppercase;font-weight:600;letter-spacing:.5px}
.kpi-card .value{font-size:1.7rem;font-weight:700;margin-top:4px}
.kpi-card .sub{font-size:.68rem;color:var(--muted);margin-top:3px}
.kpi-card .trend{font-size:.62rem;margin-top:5px;padding:2px 8px;border-radius:10px;display:inline-block}
.kpi-card .target-status{font-size:.6rem;margin-top:4px}
.trend-up{background:rgba(34,197,94,.12);color:var(--green)}
.trend-down{background:rgba(239,68,68,.12);color:var(--red)}
.charts-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;margin-bottom:20px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.chart-box h3{font-size:.75rem;font-weight:600;margin-bottom:10px;color:var(--muted)}
.table-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;overflow-x:auto;margin-top:16px}
.table-section h3{font-size:.82rem;font-weight:600;margin-bottom:10px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.7rem}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:.58rem;position:sticky;top:0;background:var(--card)}
.last-updated{font-size:.62rem;color:var(--muted)}
.view-toggle{display:flex;gap:4px;align-items:center;margin-left:auto}
.view-toggle span{font-size:.62rem;color:var(--muted)}
.alert-banner{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px 16px;margin-bottom:18px;display:none}
.alert-banner.visible{display:block}
.alert-banner h4{font-size:.72rem;color:var(--red);margin-bottom:6px;font-weight:700}
.alert-banner .alert-item{font-size:.68rem;color:var(--text);padding:3px 0;display:flex;align-items:center;gap:6px}
.alert-banner .alert-item::before{content:'âš ';font-size:.7rem}
.alert-banner .days-badge{background:rgba(239,68,68,.15);color:var(--red);padding:1px 6px;border-radius:8px;font-size:.6rem;font-weight:600}
.progress-wrap{margin-top:6px;width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;border-radius:3px;transition:width .4s ease}
.progress-green{background:var(--green)}
.progress-yellow{background:var(--yellow)}
.progress-red{background:var(--red)}
.sparkline{margin-top:8px;height:24px;display:flex;align-items:end;gap:1px}
.sparkline .bar{flex:1;border-radius:2px 2px 0 0;background:var(--accent);opacity:.6;transition:height .3s}
.sparkline .bar:last-child{opacity:1}
.heatmap-cell{border-radius:3px;padding:5px 8px!important;text-align:center!important;font-weight:600}
@keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.kpi-card .value{animation:countUp .5s ease-out forwards}
.kpi-card:nth-child(2) .value{animation-delay:.05s}
.kpi-card:nth-child(3) .value{animation-delay:.1s}
.kpi-card:nth-child(4) .value{animation-delay:.15s}
.kpi-card:nth-child(5) .value{animation-delay:.2s}
.kpi-card:nth-child(6) .value{animation-delay:.25s}
.kpi-card:nth-child(7) .value{animation-delay:.3s}
.kpi-card:nth-child(8) .value{animation-delay:.35s}
.kpi-card:nth-child(9) .value{animation-delay:.4s}
.kpi-card:nth-child(10) .value{animation-delay:.45s}
.kpi-card:nth-child(11) .value{animation-delay:.5s}
.kpi-card:nth-child(12) .value{animation-delay:.55s}
.kpi-card:nth-child(13) .value{animation-delay:.6s}
</style>
</head>
<body>
<div class="header">
  <h1><span>MSTA</span> L&amp;D Metrics Dashboard</h1>
  <div class="controls">
    <span class="last-updated" id="lastUpdated"></span>
    <select id="themeSelect" title="Theme">
      <option value="dark">Dark</option>
      <option value="white">White</option>
      <option value="purple">Purple</option>
      <option value="pink">Pink</option>
      <option value="blue">Blue</option>
      <option value="green">Green</option>
    </select>
    <button class="download-btn" id="downloadBtn">Download CSV</button>
  </div>
</div>

<div class="tabs" id="mainTabs">
  <button class="tab-btn active" data-tab="day">Day</button>
  <button class="tab-btn" data-tab="week">Week</button>
  <button class="tab-btn" data-tab="month">Month</button>
  <button class="tab-btn" data-tab="quarter">Quarter</button>
  <button class="tab-btn" data-tab="year">Year</button>
  <div class="view-toggle">
    <span>View:</span>
    <button class="tab-btn active" id="viewCard">Flash Cards</button>
    <button class="tab-btn" id="viewTable">Table</button>
  </div>
</div>

<div class="alert-banner" id="alertBanner">
  <h4>Attention Required</h4>
  <div id="alertItems"></div>
</div>

<div class="tab-content active" id="tab-day">
  <div class="period-label" id="dayLabel"></div>
  <div id="dayCards"><div class="kpi-grid" id="dayKpi"></div></div>
  <div id="dayTable" style="display:none"><div class="table-section"><table><thead><tr id="daySummaryTH"></tr></thead><tbody id="daySummaryTB"></tbody></table></div></div>
  <div class="charts-row" id="dayCharts"></div>
  <div class="table-section"><h3>Last 7 Days</h3><table><thead><tr id="dayHistTH"></tr></thead><tbody id="dayHistTB"></tbody></table></div>
</div>

<div class="tab-content" id="tab-week">
  <div class="period-label" id="weekLabel"></div>
  <div id="weekCards"><div class="kpi-grid" id="weekKpi"></div></div>
  <div id="weekTable" style="display:none"><div class="table-section"><table><thead><tr id="weekSummaryTH"></tr></thead><tbody id="weekSummaryTB"></tbody></table></div></div>
  <div class="charts-row" id="weekCharts"></div>
  <div class="table-section"><h3>Weekly Averages</h3><table><thead><tr id="weekHistTH"></tr></thead><tbody id="weekHistTB"></tbody></table></div>
</div>

<div class="tab-content" id="tab-month">
  <div class="period-label" id="monthLabel"></div>
  <div id="monthCards"><div class="kpi-grid" id="monthKpi"></div></div>
  <div id="monthTable" style="display:none"><div class="table-section"><table><thead><tr id="monthSummaryTH"></tr></thead><tbody id="monthSummaryTB"></tbody></table></div></div>
  <div class="charts-row" id="monthCharts"></div>
  <div class="table-section"><h3>Monthly Averages</h3><table><thead><tr id="monthHistTH"></tr></thead><tbody id="monthHistTB"></tbody></table></div>
</div>

<div class="tab-content" id="tab-quarter">
  <div class="period-label" id="quarterLabel"></div>
  <div id="quarterCards"><div class="kpi-grid" id="quarterKpi"></div></div>
  <div id="quarterTable" style="display:none"><div class="table-section"><table><thead><tr id="quarterSummaryTH"></tr></thead><tbody id="quarterSummaryTB"></tbody></table></div></div>
  <div class="charts-row" id="quarterCharts"></div>
  <div class="table-section"><h3>Quarterly Averages</h3><table><thead><tr id="quarterHistTH"></tr></thead><tbody id="quarterHistTB"></tbody></table></div>
</div>

<div class="tab-content" id="tab-year">
  <div class="period-label" id="yearLabel"></div>
  <div id="yearCards"><div class="kpi-grid" id="yearKpi"></div></div>
  <div id="yearTable" style="display:none"><div class="table-section"><table><thead><tr id="yearSummaryTH"></tr></thead><tbody id="yearSummaryTB"></tbody></table></div></div>
  <div class="charts-row" id="yearCharts"></div>
  <div class="table-section"><h3>Yearly Averages</h3><table><thead><tr id="yearHistTH"></tr></thead><tbody id="yearHistTB"></tbody></table></div>
</div>

// Utility functions
function pf(v){const n=parseFloat(v);return isNaN(n)?null:n;}
function avg(arr,key){
  const vals=arr.map(d=>pf(d[key])).filter(v=>v!==null);
  return vals.length?+(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):null;
}
function groupBy(data,fn){
  const g={};
  data.forEach(d=>{const k=fn(d);if(!g[k])g[k]=[];g[k].push(d);});
  return g;
}
function getWeek(dateStr){
  const d=new Date(dateStr);
  const oneJan=new Date(d.getFullYear(),0,1);
  return Math.ceil(((d-oneJan)/86400000+oneJan.getDay()+1)/7);
}
function getQuarter(dateStr){return Math.floor(new Date(dateStr).getMonth()/3)+1;}
function aggGroup(arr){
  const r={};
  COL_KEYS.forEach(k=>{r[k]=avg(arr,k);});
  return r;
}
function getLatestWithValue(arr){
  for(let i=arr.length-1;i>=0;i--){
    const d=arr[i];
    if(pf(d.ftpt_rampup_pct)!==null||pf(d.alfa_rampup_pct)!==null||pf(d.cross_training_pct)!==null)return d;
  }
  return arr[arr.length-1]||{};
}

// Render KPI cards
function getStatus(v,target,higher){
  if(v===null||target===null)return 'status-neutral';
  if(higher===false){
    // Lower is better (e.g., deviation)
    if(v<=target)return 'status-green';
    if(v<=target*1.5)return 'status-yellow';
    return 'status-red';
  }else{
    // Higher is better
    const ratio=v/target;
    if(ratio>=1)return 'status-green';
    if(ratio>=0.85)return 'status-yellow';
    return 'status-red';
  }
}

function renderKPI(containerId,data,prev){
  const el=document.getElementById(containerId);
  if(!el)return;
  el.innerHTML=METRICS.map(m=>{
    const v=pf(data[m.key]);
    const display=v!==null?v+m.unit:'-';
    const subText=m.sub?m.sub(data):'';
    const status=getStatus(v,m.target,m.higher);
    let trend='';
    if(prev){
      const pv=pf(prev[m.key]);
      if(v!==null&&pv!==null){
        const diff=+(v-pv).toFixed(1);
        if(diff!==0){
          const good=m.higher===false?diff<0:diff>0;
          trend='<span class="trend '+(good?'trend-up':'trend-down')+'">'+(diff>0?'+':'')+diff+'</span>';
        }
      }
    }
    let tgt='';
    if(m.target!==null&&v!==null){
      const met=m.higher===false?v<=m.target:v>=m.target;
      const c=met?'var(--green)':'var(--red)';
      const lab=m.rawTarget||('Target: '+m.target+'%');
      tgt='<div class="target-status" style="color:'+c+'">'+lab+(met?' &#10003;':' &#10007;')+'</div>';
    }
    // Progress bar
    let pbar='';
    if(m.target!==null&&v!==null){
      let pct;
      if(m.higher===false){
        pct=Math.max(0,Math.min(100, (1 - v/(m.target*2)) * 100));
      }else{
        pct=Math.min(100,Math.max(0,(v/m.target)*100));
      }
      const pColor=pct>=100?'progress-green':pct>=85?'progress-yellow':'progress-red';
      pbar='<div class="progress-wrap"><div class="progress-bar '+pColor+'" style="width:'+pct+'%"></div></div>';
    }
    return '<div class="kpi-card '+status+'"><div class="label">'+m.label+'</div><div class="value" data-target="'+v+'">'+display+'</div><div class="sub">'+subText+'</div>'+tgt+pbar+trend+'</div>';
  }).join('');
  // Animate counters
  animateCounters(containerId);
}

// Animate counter values
function animateCounters(containerId){
  const el=document.getElementById(containerId);
  if(!el)return;
  el.querySelectorAll('.value[data-target]').forEach(valEl=>{
    const target=parseFloat(valEl.dataset.target);
    if(isNaN(target)||target===0){return;}
    const suffix=valEl.textContent.replace(/[\d.-]/g,'');
    const duration=600;
    const start=performance.now();
    const from=0;
    function tick(now){
      const elapsed=now-start;
      const progress=Math.min(elapsed/duration,1);
      // Ease out cubic
      const eased=1-Math.pow(1-progress,3);
      const current=(from+(target-from)*eased).toFixed(1);
      valEl.textContent=current+suffix;
      if(progress<1)requestAnimationFrame(tick);
      else valEl.textContent=target+suffix;
    }
    requestAnimationFrame(tick);
  });
}

// Render summary table (Flash Card alternative)
function renderSummaryTable(thId,tbId,data){
  document.getElementById(thId).innerHTML='<th>Metric</th><th>Value</th><th>Detail</th><th>Target</th><th>Status</th>';
  document.getElementById(tbId).innerHTML=METRICS.map(m=>{
    const v=pf(data[m.key]);
    const display=v!==null?v+m.unit:'-';
    const sub=m.sub?m.sub(data):'';
    let tgt=m.rawTarget||(m.target!==null?m.target+'%':'-');
    let status='-';
    if(m.target!==null&&v!==null){
      const met=m.higher===false?v<=m.target:v>=m.target;
      status=met?'<span style="color:var(--green)">&#10003; Met</span>':'<span style="color:var(--red)">&#10007; Miss</span>';
    }
    return '<tr><td style="font-weight:600">'+m.label+'</td><td>'+display+'</td><td>'+sub+'</td><td>'+tgt+'</td><td>'+status+'</td></tr>';
  }).join('');
}

// Render history table with heatmap
function getHeatColor(n,m){
  if(!m||m.target===null||n===null)return '';
  let ratio;
  if(m.higher===false){
    // Lower is better: at target=green, 2x target=red
    ratio=Math.max(0,Math.min(1,(m.target*2-n)/(m.target*2)));
  }else{
    ratio=Math.max(0,Math.min(1,n/m.target));
  }
  // ratio: 0=worst(red), 1=best(green)
  if(ratio>=0.95)return 'rgba(34,197,94,.18)';
  if(ratio>=0.85)return 'rgba(234,179,8,.15)';
  if(ratio>=0.7)return 'rgba(249,115,22,.12)';
  return 'rgba(239,68,68,.15)';
}

function renderHistTable(thId,tbId,rows){
  document.getElementById(thId).innerHTML=COL_HEADERS.map(h=>'<th>'+h+'</th>').join('');
  document.getElementById(tbId).innerHTML=rows.map(r=>{
    return '<tr><td style="font-weight:600">'+r._period+'</td>'+COL_KEYS.map(k=>{
      const v=r[k]!==undefined&&r[k]!==null?r[k]:pf(r[k]);
      if(v===null||v===undefined)return '<td>-</td>';
      const n=typeof v==='number'?v:pf(v);
      const m=METRICS.find(x=>x.key===k);
      const bg=getHeatColor(n,m);
      const textColor=m&&m.target!==null&&n!==null?(m.higher===false?n<=m.target:n>=m.target)?'var(--green)':'var(--red)':'';
      const style=bg?'background:'+bg+';color:'+textColor:'color:'+textColor;
      return '<td class="heatmap-cell" style="'+style+'">'+n+'%</td>';
    }).join('')+'</tr>';
  }).join('');
}

  if(charts[id])charts[id].destroy();

    data:{labels,datasets:datasets.map(ds=>({...ds,fill:false,tension:.3,pointRadius:2,borderWidth:2}))},

  });
}

  const el=document.getElementById(containerId);
  el.innerHTML='<div class="chart-box"><h3>Ramp-Up Trend</h3><canvas id="'+prefix+'C1"></canvas></div>'+
    '<div class="chart-box"><h3>Cross-Training &amp; Pool</h3><canvas id="'+prefix+'C2"></canvas></div>';
  makeChart(prefix+'C1',labels,[
    {label:'FT+PT %',data:data.map(d=>pf(d.ftpt_rampup_pct)),borderColor:'#6366f1'},
    {label:'ALFA %',data:data.map(d=>pf(d.alfa_rampup_pct)),borderColor:'#22c55e'},
    {label:'ALFA Crit %',data:data.map(d=>pf(d.alfa_crit_rampup_pct)),borderColor:'#eab308'}
  ]);
  makeChart(prefix+'C2',labels,[
    {label:'Cross-Train %',data:data.map(d=>pf(d.cross_training_pct)),borderColor:'#06b6d4'},
    {label:'Crit Pool %',data:data.map(d=>pf(d.alfa_crit_pool_pct)),borderColor:'#f97316'}
  ]);
}

// === TAB RENDERERS ===
function renderDay(){
  const latest=getLatestWithValue(metricsData);
  const prev=metricsData.length>1?metricsData[metricsData.length-2]:null;
  document.getElementById('dayLabel').textContent='Current Day: '+latest.metric_date;
  renderKPI('dayKpi',latest,prev);
  renderSummaryTable('daySummaryTH','daySummaryTB',latest);
  // Last 7 days
  const last7=metricsData.slice(-7).reverse();
  const rows=last7.map(d=>({...d,_period:d.metric_date}));
  renderHistTable('dayHistTH','dayHistTB',rows);
  // Charts
  const cData=metricsData.slice(-7);
  renderCharts('dayCharts',cData.map(d=>d.metric_date),cData,'day');
}

function renderWeek(){
  const latest=metricsData[metricsData.length-1];
  const yr=new Date(latest.metric_date).getFullYear();
  const cw=getWeek(latest.metric_date);
  document.getElementById('weekLabel').textContent='Current Week: W'+cw+' ('+yr+')';
  // Group by week
  const weeks=groupBy(metricsData,d=>new Date(d.metric_date).getFullYear()+'-W'+String(getWeek(d.metric_date)).padStart(2,'0'));
  const keys=Object.keys(weeks).sort().reverse();
  const currentKey=keys[0];
  const prevKey=keys[1];
  const curAgg=aggGroup(weeks[currentKey]);
  const prevAgg=prevKey?aggGroup(weeks[prevKey]):null;
  renderKPI('weekKpi',curAgg,prevAgg);
  renderSummaryTable('weekSummaryTH','weekSummaryTB',curAgg);
  // Table
  const tableRows=keys.slice(0,12).map(k=>{const a=aggGroup(weeks[k]);a._period=k;return a;});
  renderHistTable('weekHistTH','weekHistTB',tableRows);
  // Charts
  const chartKeys=keys.slice(0,12).reverse();
  const chartData=chartKeys.map(k=>aggGroup(weeks[k]));
  renderCharts('weekCharts',chartKeys,chartData,'week');
}

function renderMonth(){
  const latest=metricsData[metricsData.length-1];
  const dt=new Date(latest.metric_date);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('monthLabel').textContent='Current Month: '+months[dt.getMonth()]+' '+dt.getFullYear();
  // Group by month
  const grp=groupBy(metricsData,d=>{const x=new Date(d.metric_date);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');});
  const keys=Object.keys(grp).sort().reverse();
  const curAgg=aggGroup(grp[keys[0]]);
  const prevAgg=keys[1]?aggGroup(grp[keys[1]]):null;
  renderKPI('monthKpi',curAgg,prevAgg);
  renderSummaryTable('monthSummaryTH','monthSummaryTB',curAgg);
  // Table
  const tableRows=keys.slice(0,12).map(k=>{
    const a=aggGroup(grp[k]);
    const[y,m]=k.split('-');
    a._period=months[parseInt(m)-1]+' '+y;
    return a;
  });
  renderHistTable('monthHistTH','monthHistTB',tableRows);
  // Charts
  const chartKeys=keys.slice(0,12).reverse();
  const chartData=chartKeys.map(k=>aggGroup(grp[k]));
  const chartLabels=chartKeys.map(k=>{const[y,m]=k.split('-');return months[parseInt(m)-1]+' '+y;});
  renderCharts('monthCharts',chartLabels,chartData,'month');
}

function renderQuarter(){
  const latest=metricsData[metricsData.length-1];
  const yr=new Date(latest.metric_date).getFullYear();
  const q=getQuarter(latest.metric_date);
  document.getElementById('quarterLabel').textContent='Current Quarter: Q'+q+' '+yr;
  const grp=groupBy(metricsData,d=>{const x=new Date(d.metric_date);return x.getFullYear()+'-Q'+getQuarter(d.metric_date);});
  const keys=Object.keys(grp).sort().reverse();
  const curAgg=aggGroup(grp[keys[0]]);
  const prevAgg=keys[1]?aggGroup(grp[keys[1]]):null;
  renderKPI('quarterKpi',curAgg,prevAgg);
  renderSummaryTable('quarterSummaryTH','quarterSummaryTB',curAgg);
  const tableRows=keys.slice(0,8).map(k=>{const a=aggGroup(grp[k]);a._period=k;return a;});
  renderHistTable('quarterHistTH','quarterHistTB',tableRows);
  const chartKeys=keys.slice(0,8).reverse();
  const chartData=chartKeys.map(k=>aggGroup(grp[k]));
  renderCharts('quarterCharts',chartKeys,chartData,'quarter');
}

function renderYear(){
  const latest=metricsData[metricsData.length-1];
  const yr=new Date(latest.metric_date).getFullYear();
  document.getElementById('yearLabel').textContent='Current Year: '+yr;
  const grp=groupBy(metricsData,d=>String(new Date(d.metric_date).getFullYear()));
  const keys=Object.keys(grp).sort().reverse();
  const curAgg=aggGroup(grp[keys[0]]);
  const prevAgg=keys[1]?aggGroup(grp[keys[1]]):null;
  renderKPI('yearKpi',curAgg,prevAgg);
  renderSummaryTable('yearSummaryTH','yearSummaryTB',curAgg);
  const tableRows=keys.slice(0,5).map(k=>{const a=aggGroup(grp[k]);a._period=k;return a;});
  renderHistTable('yearHistTH','yearHistTB',tableRows);
  const chartKeys=keys.slice(0,5).reverse();
  const chartData=chartKeys.map(k=>aggGroup(grp[k]));
  renderCharts('yearCharts',chartKeys,chartData,'year');
}

// === INITIALIZATION AND EVENTS ===
function renderAll(){
  const latest=metricsData[metricsData.length-1];
  if(latest)document.getElementById('lastUpdated').textContent='Last updated: '+latest.metric_date+' at '+(latest.fetch_time||'').split(' ').pop();
  renderDay();renderWeek();renderMonth();renderQuarter();renderYear();
  renderAlerts();
}

function renderAlerts(){
  // Find metrics below target for 3+ consecutive days
  const banner=document.getElementById('alertBanner');
  const items=document.getElementById('alertItems');
  const alerts=[];
  const recent=metricsData.slice(-30);// check last 30 days

  METRICS.forEach(m=>{
    if(m.target===null)return;
    // Count consecutive days below target (from most recent backward)
    let streak=0;
    for(let i=recent.length-1;i>=0;i--){
      const v=pf(recent[i][m.key]);
      if(v===null)continue;
      const met=m.higher===false?v<=m.target:v>=m.target;
      if(!met)streak++;
      else break;
    }
    if(streak>=3){
      const latest=pf(recent[recent.length-1][m.key]);
      const gap=m.higher===false?(latest-m.target).toFixed(1):(m.target-latest).toFixed(1);
      alerts.push({label:m.label,days:streak,current:latest,target:m.target,gap:gap,unit:m.unit||'%'});
    }
  });

  if(alerts.length>0){
    banner.classList.add('visible');
    items.innerHTML=alerts.map(a=>
      '<div class="alert-item">'+a.label+': <strong>'+a.current+a.unit+'</strong> (target: '+a.target+a.unit+', gap: '+a.gap+') <span class="days-badge">'+a.days+' days</span></div>'
    ).join('');
  }else{
    banner.classList.remove('visible');
  }
}

async function loadData(){metricsData.sort((a,b)=>a.metric_date.localeCompare(b.metric_date));renderAll();}

// Tab switching
document.querySelectorAll('#mainTabs .tab-btn[data-tab]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#mainTabs .tab-btn[data-tab]').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

// View toggle
function setView(view){
  currentView=view;
  const tabs=['day','week','month','quarter','year'];
  tabs.forEach(t=>{
    const cards=document.getElementById(t+'Cards');
    const table=document.getElementById(t+'Table');
    if(cards)cards.style.display=view==='card'?'block':'none';
    if(table)table.style.display=view==='table'?'block':'none';
  });
  document.getElementById('viewCard').classList.toggle('active',view==='card');
  document.getElementById('viewTable').classList.toggle('active',view==='table');
}
document.getElementById('viewCard').addEventListener('click',()=>setView('card'));
document.getElementById('viewTable').addEventListener('click',()=>setView('table'));

// Theme
const themeSelect=document.getElementById('themeSelect');
themeSelect.addEventListener('change',function(){
  document.documentElement.setAttribute('data-theme',this.value);
  localStorage.setItem('dash-theme',this.value);
  renderAll();
});
const saved=localStorage.getItem('dash-theme')||'dark';
document.documentElement.setAttribute('data-theme',saved);
themeSelect.value=saved;

// CSV Download
document.getElementById('downloadBtn').addEventListener('click',function(){
  let csv='Date,'+METRICS.map(m=>m.label).join(',')+'\n';
  metricsData.forEach(d=>{
    csv+=d.metric_date+','+COL_KEYS.map(k=>d[k]||'-').join(',')+'\n';
  });
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='MSTA_Metrics_'+new Date().toISOString().split('T')[0]+'.csv';
  a.click();
});

loadData();
</script>
