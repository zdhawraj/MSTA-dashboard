name: Update MSTA Dashboard

on:
  schedule:
    # Run daily at 00:30 UTC = 6:00 AM IST
    - cron: '30 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch metrics and generate dashboard
        run: |
          node update-metrics.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html metrics_data.json
          git diff --staged --quiet || (git commit -m "Auto-update dashboard - $(date -u +%Y-%m-%d)" && git push)
